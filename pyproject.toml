[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odin-linux"
version = "1.0.0"
authors = [
  { name = "wisabuilds" }
]
description = "Modern GTK4 and Libadwaita graphical interface for Samsung Odin4 on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["samsung", "odin", "odin4", "firmware", "flash", "android", "galaxy", "gtk4", "libadwaita"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: System :: Hardware"
]
dependencies = [
    "PyGObject>=3.42.0"
]

[project.scripts]
odin-linux = "odin_linux.app:main"

[project.urls]
Homepage = "https://github.com/wisabuilds/odin-linux"
Repository = "https://github.com/wisabuilds/odin-linux.git"
"Bug Tracker" = "https://github.com/wisabuilds/odin-linux/issues"
