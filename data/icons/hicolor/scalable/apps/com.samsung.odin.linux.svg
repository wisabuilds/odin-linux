<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Samsung Deep Royal Blue Gradient -->
    <linearGradient id="odinBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1558b0"/>
      <stop offset="100%" stop-color="#08224d"/>
    </linearGradient>

    <!-- Subtle Bevel Top Highlight -->
    <linearGradient id="topBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Squircle (GNOME HIG Keyline) -->
  <rect x="12" y="12" width="104" height="104" rx="24" fill="url(#odinBase)" filter="url(#shadow)"/>
  <rect x="12.5" y="12.5" width="103" height="103" rx="23.5" fill="none" stroke="url(#topBevel)" stroke-width="1"/>

  <!-- Valknut / Geometric Odin Triangles -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Apex Triangle -->
    <polygon points="64,28 88,70 40,70" stroke="#ffffff" stroke-width="6" stroke-opacity="0.95"/>
    
    <!-- Bottom Right Triangle -->
    <polygon points="76,49 100,91 52,91" stroke="#ffffff" stroke-width="6" stroke-opacity="0.80"/>
    
    <!-- Bottom Left Triangle -->
    <polygon points="52,49 76,91 28,91" stroke="#ffffff" stroke-width="6" stroke-opacity="0.80"/>
  </g>

  <!-- Hardware Download Pulse / Download Pin -->
  <circle cx="64" cy="56" r="4" fill="#38ef7d"/>
</svg>
